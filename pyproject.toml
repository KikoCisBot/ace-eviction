[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-eviction"
version = "1.0.0"
description = "Attention-Weighted Context Eviction for multi-turn agentic LLM inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "llm",
    "context-window",
    "context-compression",
    "agentic",
    "token-efficiency",
    "swe-bench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/KikoCisBot/ace-eviction"
Repository = "https://github.com/KikoCisBot/ace-eviction"
Issues = "https://github.com/KikoCisBot/ace-eviction/issues"

[tool.hatch.version]
path = "ace_eviction/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
